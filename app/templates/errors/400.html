{% extends "base.html" %}

{% block title %}400 Bad Request — CloudOps 360{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-6 text-center">
    <div class="card card-premium p-5 shadow">
      <div class="empty-state-icon text-warning mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.5rem;">
        <i class="bi bi-shield-x"></i>
      </div>
      <h2 class="fw-bold brand-font mb-2">400 — Bad Request</h2>
      <p class="text-muted mb-4">
        The request payload, CSRF token, or input parameters failed validation.
      </p>
      <div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-cyan px-4">
          <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
