# CloudOps 360 - Nginx with HTTPS/TLS (Lab 3).
# Certificate options (see docs/aws_deployment.md, "HTTPS"):
#   a) Let's Encrypt (needs a DNS name pointing at the instance): certbot --nginx
#   b) Self-signed for a lab demo:  sudo bash infrastructure/aws/tls_self_signed.sh
# Install: sudo cp nginx_https.conf /etc/nginx/conf.d/cloudops360.conf && sudo nginx -t && sudo systemctl reload nginx
# Then set SESSION_COOKIE_SECURE=true in /etc/cloudops360/cloudops360.env and restart cloudops360.

upstream cloudops360_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    # Load balancer / monitoring probes may stay on HTTP
    location = /health { proxy_pass http://cloudops360_app; proxy_set_header Host $host; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # 'listen ... ssl http2' works on every nginx version shipped with Amazon Linux 2023
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/pki/cloudops360/cloudops360.crt;
    ssl_certificate_key /etc/pki/cloudops360/cloudops360.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CloudOpsTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 13m;

    location /static/ {
        alias /opt/cloudops360/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    location / {
        proxy_pass http://cloudops360_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
