# CloudOps 360 - Nginx reverse proxy (HTTP). Used for Lab 1 and Lab 2.
# Install: sudo cp nginx.conf /etc/nginx/conf.d/cloudops360.conf && sudo nginx -t && sudo systemctl reload nginx
# Lab 3: replace with nginx_https.conf (HTTP -> HTTPS redirect + TLS).

upstream cloudops360_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Slightly above the app's MAX_CONTENT_LENGTH (12 MB) so Flask returns the friendly 413 page
    client_max_body_size 13m;

    location /static/ {
        alias /opt/cloudops360/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        proxy_pass http://cloudops360_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
