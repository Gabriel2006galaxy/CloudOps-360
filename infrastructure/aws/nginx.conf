# ==============================================================================
# CloudOps 360 Nginx Configuration (Amazon Linux 2023 / Ubuntu)
# Place at: /etc/nginx/conf.d/cloudops360.conf
# ==============================================================================

# Upstream Gunicorn socket
upstream cloudops360_gunicorn {
    server unix:/run/cloudops360/cloudops360.sock fail_timeout=0;
}

# HTTP Server — Enforce HTTPS Redirection in Production
server {
    listen 80;
    listen [::]:80;
    server_name cloudops360.yourdomain.com _;

    # ALB / Route53 Health Check endpoint directly allowed over HTTP
    location /health {
        proxy_pass http://cloudops360_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP traffic to HTTPS if SSL is configured
    # In lab demo environments without domain names, comment out the return 301 and proxy directly
    # return 301 https://$host$request_uri;

    # Direct proxy fallback for Lab 1 (EC2 Public IP HTTP demo):
    location / {
        proxy_pass http://cloudops360_gunicorn;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for database and SLA queries
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static file serving directly via Nginx
    location /static/ {
        alias /var/www/cloudops-360/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    client_max_body_size 10M;
}

