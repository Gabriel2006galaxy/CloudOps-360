# Local development stack: MySQL 8.0 (mirrors Amazon RDS for MySQL) + the Flask app.
# Credentials come from your gitignored .env:
#   MYSQL_ROOT_PASSWORD=...   MYSQL_PASSWORD=...
# Start:  docker compose up -d db      (database only; run Flask from your venv)
#         docker compose up --build    (database + app on http://localhost:5000)

services:
  db:
    image: mysql:8.0
    container_name: cloudops360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: cloudops360
      MYSQL_USER: cloudops_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"   # bound to localhost only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build: .
    container_name: cloudops360-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      FLASK_HOST: 0.0.0.0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://cloudops_user:${MYSQL_PASSWORD}@db:3306/cloudops360?charset=utf8mb4
      UPLOAD_FOLDER: /app/uploads
      CLOUDOPS_SKIP_DOTENV: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql_data:
  uploads:
